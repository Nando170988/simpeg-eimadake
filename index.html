<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPEG Puskesmas Eimadake | Real-Time Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f1f5f9; 
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-link.active {
            background: linear-gradient(to right, #2563eb, #3b82f6);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        .input-focus:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            outline: none;
        }

        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; }
        }
        .print-only { display: none; }

        /* Custom Transition */
        .page-transition {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-900">

    <!-- Screen Loader -->
    <div id="loader" class="fixed inset-0 bg-slate-900 z-[100] flex flex-col items-center justify-center">
        <div class="relative w-20 h-20 mb-6">
            <div class="absolute inset-0 border-4 border-blue-500/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
        <p class="text-[11px] font-bold uppercase tracking-[0.3em] text-blue-400">Menyiapkan Enkripsi Data...</p>
    </div>

    <!-- Login Container -->
    <div id="login-container" class="hidden flex items-center justify-center min-h-screen bg-slate-950 px-4 relative overflow-hidden">
        <!-- Abstract Bg -->
        <div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-blue-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-96 h-96 bg-indigo-600/20 rounded-full blur-[120px]"></div>

        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md z-10">
            <div class="text-center mb-10">
                <div class="flex justify-center items-center space-x-6 mb-8">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/ea/Lambang_Kabupaten_Sabu_Raijua.png" alt="Sabu Raijua" class="h-16">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Logo_Puskesmas_Indonesia.png" alt="Puskesmas" class="h-16">
                </div>
                <h1 class="text-3xl font-black tracking-tighter text-slate-900">SIMPEG <span class="text-blue-600">ONLINE</span></h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-2">Puskesmas Eimadake - Sabu Tengah</p>
            </div>
            
            <div class="space-y-5">
                <div class="group">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Otoritas Akses</label>
                    <div class="relative">
                        <select id="loginUser" class="w-full p-4 pl-12 border-2 border-slate-100 rounded-2xl bg-slate-50 font-bold appearance-none input-focus group-hover:border-blue-200 transition-all">
                            <option value="staff">Staff Pegawai</option>
                            <option value="admin">Administrator Sistem</option>
                        </select>
                        <i class="fas fa-user-shield absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                    </div>
                </div>
                <div class="group">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Kunci Keamanan</label>
                    <div class="relative">
                        <input type="password" id="loginPass" class="w-full p-4 pl-12 border-2 border-slate-100 rounded-2xl bg-slate-50 font-bold input-focus group-hover:border-blue-200 transition-all" placeholder="••••••••">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 hover:text-blue-600 transition-colors">
                            <i id="eye-icon" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div id="login-error" class="hidden animate-pulse">
                    <div class="bg-red-50 text-red-600 text-[10px] font-black uppercase text-center p-4 rounded-2xl border border-red-100">Password Salah atau Koneksi Terputus</div>
                </div>
                <button onclick="handleLogin()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-blue-600 hover:shadow-2xl hover:shadow-blue-500/30 transition-all duration-300">
                    Buka Dashboard <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>
            <p class="text-center mt-8 text-[9px] font-bold text-slate-300 uppercase">Versi 2.1.0 Cloud Powered</p>
        </div>
    </div>

    <!-- App Container -->
    <div id="app-container" class="hidden flex flex-col md:flex-row min-h-screen no-print h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-full md:w-72 bg-slate-950 text-white flex-shrink-0 z-20 flex flex-col p-6">
            <div class="flex items-center space-x-4 mb-10 px-2">
                <div class="p-2 bg-white rounded-xl">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Logo_Puskesmas_Indonesia.png" class="h-8">
                </div>
                <div>
                    <h2 class="font-black text-lg tracking-tight uppercase leading-none">EIMADAKE</h2>
                    <span class="text-[9px] font-black text-blue-500 uppercase tracking-widest">Digital Simpeg</span>
                </div>
            </div>

            <nav class="flex-1 space-y-2">
                <p class="text-[9px] font-black text-slate-600 uppercase mb-4 px-2 tracking-widest">Main Menu</p>
                <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-link w-full flex items-center space-x-4 p-4 rounded-2xl transition-all text-sm font-bold text-slate-400 hover:text-white">
                    <i class="fas fa-th-large w-5"></i>
                    <span>Dashboard</span>
                </button>
                <button onclick="navigate('pegawai')" id="nav-pegawai" class="nav-link w-full flex items-center space-x-4 p-4 rounded-2xl transition-all text-sm font-bold text-slate-400 hover:text-white">
                    <i class="fas fa-users w-5"></i>
                    <span>Database Pegawai</span>
                </button>
                <button onclick="navigate('pelatihan')" id="nav-pelatihan" class="nav-link w-full flex items-center space-x-4 p-4 rounded-2xl transition-all text-sm font-bold text-slate-400 hover:text-white">
                    <i class="fas fa-medal w-5"></i>
                    <span>Diklat & Pelatihan</span>
                </button>
                <button onclick="navigate('keluarga')" id="nav-keluarga" class="nav-link w-full flex items-center space-x-4 p-4 rounded-2xl transition-all text-sm font-bold text-slate-400 hover:text-white">
                    <i class="fas fa-house-chimney w-5"></i>
                    <span>Data Keluarga</span>
                </button>
                <div class="pt-4 mt-4 border-t border-slate-900">
                    <p class="text-[9px] font-black text-slate-600 uppercase mb-4 px-2 tracking-widest">System</p>
                    <button onclick="navigate('export')" id="nav-export" class="nav-link w-full flex items-center space-x-4 p-4 rounded-2xl transition-all text-sm font-bold text-slate-400 hover:text-white">
                        <i class="fas fa-file-export w-5"></i>
                        <span>Laporan & Ekspor</span>
                    </button>
                </div>
            </nav>

            <div class="mt-auto pt-6 border-t border-slate-900">
                <div class="bg-slate-900/50 p-4 rounded-[1.5rem] mb-4">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-black text-sm" id="user-initial">A</div>
                        <div class="overflow-hidden">
                            <p id="user-display" class="text-xs font-black uppercase truncate">Administrator</p>
                            <span class="text-[9px] text-emerald-400 font-bold uppercase flex items-center gap-1">
                                <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span> Online Mode
                            </span>
                        </div>
                    </div>
                </div>
                <button onclick="handleLogout()" class="w-full p-4 bg-red-500/10 text-red-500 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-red-500 hover:text-white transition-all">
                    LOGOUT SYSTEM
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-[#f8fafc] h-screen overflow-hidden">
            <header class="bg-white/80 backdrop-blur-md border-b h-20 flex items-center justify-between px-8 shrink-0 z-10">
                <div class="flex flex-col">
                    <h2 id="menu-title" class="text-xl font-black text-slate-900 tracking-tight leading-none">Dashboard</h2>
                    <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest">Puskesmas Eimadake Monitoring</p>
                </div>
                <div class="flex items-center gap-6">
                    <div class="hidden lg:flex flex-col items-end">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Database Cloud</span>
                        <span class="text-xs font-bold text-slate-900">michellyohan@gmail.com</span>
                    </div>
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/ea/Lambang_Kabupaten_Sabu_Raijua.png" class="h-10 opacity-80">
                </div>
            </header>

            <div id="main-viewport" class="p-6 md:p-10 overflow-y-auto flex-1 page-transition">
                <!-- Content Here -->
            </div>
        </main>
    </div>

    <!-- Print Canvas -->
    <div id="print-view" class="print-only"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pkm-eimadake-2024';

        // App State
        let employees = [];
        let currentRole = null;
        let currentMenu = 'dashboard';
        let isEditing = null;

        // --- AUTH ---
        window.togglePasswordVisibility = () => {
            const input = document.getElementById('loginPass');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        };

        window.handleLogin = async () => {
            const role = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const errorEl = document.getElementById('login-error');
            
            errorEl.classList.add('hidden');

            const validAdmin = (role === 'admin' && pass === 'Nandoyohan17#');
            const validStaff = (role === 'staff' && pass === 'pkmeimadakeok');

            if (validAdmin || validStaff) {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    localStorage.setItem('pkm_user_role', role);
                } catch (err) {
                    alert("Koneksi gagal: " + err.message);
                }
            } else {
                errorEl.classList.remove('hidden');
            }
        };

        window.handleLogout = async () => {
            await signOut(auth);
            localStorage.removeItem('pkm_user_role');
        };

        onAuthStateChanged(auth, (user) => {
            const loader = document.getElementById('loader');
            if (user) {
                currentRole = localStorage.getItem('pkm_user_role') || 'staff';
                document.getElementById('user-display').innerText = currentRole === 'admin' ? 'Administrator' : 'Staff Pegawai';
                document.getElementById('user-initial').innerText = currentRole.charAt(0).toUpperCase();
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                initRealtimeSync();
            } else {
                document.getElementById('login-container').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
            loader.classList.add('hidden');
        });

        // --- DATABASE SYNC ---
        function initRealtimeSync() {
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'employees');
            onSnapshot(colRef, (snapshot) => {
                employees = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderUI();
            }, (err) => console.error("Sync Error:", err));
        }

        // --- NAVIGATION ---
        window.navigate = (menu) => {
            currentMenu = menu;
            isEditing = null;
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            const activeNav = document.getElementById(`nav-${menu}`);
            if (activeNav) activeNav.classList.add('active');
            renderUI();
        };

        // --- RENDERING ---
        function renderUI() {
            const viewport = document.getElementById('main-viewport');
            const title = document.getElementById('menu-title');

            switch(currentMenu) {
                case 'dashboard':
                    title.innerText = "Ringkasan Eksekutif";
                    viewport.innerHTML = getDashboardHTML();
                    break;
                case 'pegawai':
                    title.innerText = "Manajemen Database Pegawai";
                    viewport.innerHTML = getPegawaiHTML();
                    break;
                case 'pelatihan':
                    title.innerText = "Data Diklat & Kompetensi";
                    viewport.innerHTML = getPelatihanHTML();
                    break;
                case 'keluarga':
                    title.innerText = "Arsip Anggota Keluarga";
                    viewport.innerHTML = getKeluargaHTML();
                    break;
                case 'export':
                    title.innerText = "Export & Maintenance";
                    viewport.innerHTML = getExportHTML();
                    break;
            }
        }

        function getDashboardHTML() {
            const stats = {
                pns: employees.filter(e => e.status === 'PNS').length,
                pppk: employees.filter(e => e.status === 'PPPK').length,
                kontrak: employees.filter(e => e.status === 'Kontrak').length,
                total: employees.length
            };

            const kgbAlerts = employees.filter(e => {
                if (!e.tgl_kgb) return false;
                const diff = (new Date(e.tgl_kgb) - new Date()) / (1000 * 60 * 60 * 24);
                return diff <= 30 && diff >= 0;
            });

            return `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                    <div class="bg-gradient-to-br from-blue-600 to-blue-700 p-8 rounded-[2.5rem] text-white shadow-xl shadow-blue-500/20 relative overflow-hidden group">
                        <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:scale-125 transition-transform"><i class="fas fa-id-card text-7xl"></i></div>
                        <p class="text-[10px] font-black uppercase tracking-widest mb-1 opacity-70">Aparatur Sipil Negara</p>
                        <p class="text-3xl font-black">${stats.pns}</p>
                        <p class="text-[10px] font-bold mt-4 bg-white/10 w-fit px-3 py-1 rounded-full">Status: PNS Aktif</p>
                    </div>
                    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm relative overflow-hidden group">
                        <div class="absolute top-0 right-0 p-4 opacity-5 group-hover:scale-125 transition-transform"><i class="fas fa-user-check text-7xl"></i></div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">PPPK</p>
                        <p class="text-3xl font-black text-slate-900">${stats.pppk}</p>
                        <p class="text-[10px] font-bold mt-4 bg-emerald-50 text-emerald-600 w-fit px-3 py-1 rounded-full">Status: Aktif</p>
                    </div>
                    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm relative overflow-hidden group">
                        <div class="absolute top-0 right-0 p-4 opacity-5 group-hover:scale-125 transition-transform"><i class="fas fa-file-contract text-7xl"></i></div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Tenaga Kontrak</p>
                        <p class="text-3xl font-black text-slate-900">${stats.kontrak}</p>
                        <p class="text-[10px] font-bold mt-4 bg-amber-50 text-amber-600 w-fit px-3 py-1 rounded-full">Status: Aktif</p>
                    </div>
                    <div class="bg-slate-900 p-8 rounded-[2.5rem] text-white shadow-xl relative overflow-hidden group">
                        <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:scale-125 transition-transform"><i class="fas fa-users-viewfinder text-7xl"></i></div>
                        <p class="text-[10px] font-black uppercase tracking-widest mb-1 opacity-60">Total Pegawai</p>
                        <p class="text-3xl font-black">${stats.total}</p>
                        <p class="text-[10px] font-bold mt-4 bg-blue-500 w-fit px-3 py-1 rounded-full">Semua Kategori</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 bg-white rounded-[2.5rem] border border-slate-200 shadow-sm overflow-hidden">
                        <div class="p-8 border-b flex justify-between items-center bg-slate-50/50">
                            <h3 class="text-xs font-black uppercase tracking-widest text-slate-900 flex items-center gap-3">
                                <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span> Warning KGB (30 Hari)
                            </h3>
                            <button class="text-[10px] font-black text-blue-600 uppercase">Lihat Detail</button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead class="text-[10px] uppercase font-black text-slate-400 bg-white">
                                    <tr><th class="p-6">Nama</th><th class="p-6">Pangkat/Gol</th><th class="p-6">Deadline</th></tr>
                                </thead>
                                <tbody class="divide-y text-sm">
                                    ${kgbAlerts.length === 0 ? '<tr><td colspan="3" class="p-16 text-center text-slate-300 font-bold uppercase italic">Semua data gaji berkala aman.</td></tr>' : 
                                      kgbAlerts.map(e => `
                                        <tr>
                                            <td class="p-6 font-black text-slate-900 uppercase">${e.nama}</td>
                                            <td class="p-6 font-bold text-blue-600">${e.pangkat_nama} / ${e.pangkat}</td>
                                            <td class="p-6 text-red-600 font-black">${new Date(e.tgl_kgb).toLocaleDateString('id-ID')}</td>
                                        </tr>
                                      `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-[2.5rem] border border-slate-200 p-8 shadow-sm">
                        <h3 class="text-xs font-black uppercase tracking-widest text-slate-900 mb-8 border-l-4 border-blue-600 pl-4">Distribusi Profesi</h3>
                        <div class="space-y-6">
                            ${['Perawat', 'Bidan', 'Dokter', 'Admin'].map(p => {
                                const count = employees.filter(e => (e.jabatan || '').toLowerCase().includes(p.toLowerCase())).length;
                                const perc = stats.total ? (count / stats.total) * 100 : 0;
                                return `
                                    <div>
                                        <div class="flex justify-between text-[11px] font-bold uppercase mb-2">
                                            <span class="text-slate-500">${p}</span>
                                            <span class="text-slate-900">${count} Personel</span>
                                        </div>
                                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                            <div class="bg-blue-600 h-full rounded-full transition-all duration-1000" style="width: ${perc}%"></div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function getPegawaiHTML() {
            const golArray = ["IV/e", "IV/d", "IV/c", "IV/b", "IV/a", "III/d", "III/c", "III/b", "III/a", "II/d", "II/c", "II/b", "II/a", "I/d", "I/c", "I/b", "I/a"];
            const pangkatArray = [
                "Pembina Utama", "Pembina Utama Madya", "Pembina Utama Muda", "Pembina Tingkat I", "Pembina",
                "Penata Tingkat I", "Penata", "Penata Muda Tingkat I", "Penata Muda",
                "Pengatur Tingkat I", "Pengatur", "Pengatur Muda Tingkat I", "Pengatur Muda",
                "Juru Tingkat I", "Juru", "Juru Muda Tingkat I", "Juru Muda"
            ];

            return `
                <div class="max-w-6xl mx-auto space-y-10 pb-20">
                    <div class="bg-white p-10 rounded-[3rem] border border-slate-200 shadow-xl shadow-slate-200/50">
                        <div class="flex items-center gap-4 mb-10">
                            <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-xl shadow-lg shadow-blue-500/20"><i class="fas fa-file-pen"></i></div>
                            <div>
                                <h3 class="text-lg font-black uppercase text-slate-900 tracking-tight">Formulir Identitas Pegawai</h3>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Silahkan lengkapi data sesuai dokumen asli</p>
                            </div>
                        </div>

                        <form id="pegawai-form" onsubmit="savePegawai(event)" class="grid grid-cols-1 md:grid-cols-3 gap-x-8 gap-y-6">
                            <!-- Kolom 1 -->
                            <div class="space-y-6">
                                <div class="group">
                                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Nama Lengkap</label>
                                    <input type="text" id="nama" class="w-full p-4 border-2 border-slate-100 rounded-2xl bg-slate-50 font-bold text-sm input-focus" required placeholder="Contoh: Budi Santoso, S.KM">
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="group">
                                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">NIP</label>
                                        <input type="text" id="nip" class="w-full p-4 border-2 border-slate-100 rounded-2xl bg-slate-50 font-bold text-sm input-focus" placeholder="18 digit">
                                    </div>
                                    <div class="group">
                                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">NIK</label>
                                        <input type="text" id="nik" class="w-full p-4 border-2 border-slate-100 rounded-2xl bg-slate-50 font-bold text-sm input-focus" required placeholder="16 digit">
                                    </div>
                                </div>

                nik: document.getElementById('nik').value,
                jenis_kelamin: document.getElementById('jenis_kelamin').value,

                pangkat_nama: document.getElementById('pangkat_nama').value,

                tmt_jabatan: document.getElementById('tmt_jabatan').value,
                no_hp: document.getElementById('no_hp').value,
                alamat: document.getElementById('alamat').value,
                no_str: document.getElementById('no_str').value,
                no_sip: document.getElementById('no_sip').value,
                str_seumur_hidup: document.getElementById('str_seumur_hidup').checked,
                tgl_kgb: document.getElementById('tgl_kgb').value,
                updatedAt: new Date().toISOString()
            };

            const targetId = isEditing || crypto.randomUUID();
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'employees', targetId);
            
            try {
                await setDoc(docRef, data, { merge: true });
                isEditing = null;
                e.target.reset();
                alert("Sinkronisasi Berhasil: Data Tersimpan di Cloud.");
            } catch (err) {
                alert("Gagal Sinkron: " + err.message);
            }
        };
